# seatd 覆盖配置
#
# 上游 seatd.service 的 ExecStart 是 `seatd -g seat`，要求系统里存在 seat 组，
# 且只允许该组成员连接。Buildroot 的 seatd 包虽然定义了 SEATD_USERS，
# 但在这个镜像里 /etc/group 并没有 seat（已实测确认），于是 seatd 启动即失败：
#   libseat/backend/seatd.c: Could not poll connection: Broken pipe
#   → wlroots "No backend was able to open a seat"
#   → sway/weston 都起不来，屏幕全黑
#
# shuios 的桌面会话固定以 root 运行，所以直接把 socket 组设为 root 即可，
# 既不需要额外用户组，也避免权限模型变复杂。
[Service]
ExecStart=
ExecStart=seatd -g root
