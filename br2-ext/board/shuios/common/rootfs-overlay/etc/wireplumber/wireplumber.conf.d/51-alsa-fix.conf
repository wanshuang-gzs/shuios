# VMware 虚拟 HDA（snd_hda_intel）的两个坑，都会让播放器「显示在播但进度不动」：
#
# 1) 默认的定时器调度（tsched）在这里不停报
#      snd_pcm_avail after recover: Broken pipe
#    音频流拿不到数据，currentTime 永远停在 0。
# 2) 空闲几秒后节点会被自动挂起（suspend），恢复时虚拟声卡容易卡死，
#    换歌/重新播放就再也出不了声。
#
# 处理：改用 ALSA 周期中断驱动 + 放大周期与余量；同时关掉自动挂起。
# 实测 3 秒测试音正好 3 秒播完，QQ音乐 切歌后进度条正常前进。
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        api.alsa.disable-tsched = true
        api.alsa.period-size = 1024
        api.alsa.period-num = 8
        api.alsa.headroom = 4096
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
