set timeout=3
set default=0

insmod all_video
insmod gfxterm
insmod gzio
insmod squash4
insmod ext2
insmod fat
insmod part_gpt
insmod part_msdos
insmod search_label
# load_env/save_env 在 loadenv 模块里；不 insmod 的话 A/B 状态机整体失效
# （串口日志里会看到 `error: can't find command 'load_env'`）。
insmod loadenv

# A/B 状态存在 ESP 的 /EFI/BOOT/grubenv（即 $prefix/grubenv），
# 由 shuios-update 在运行时改写，由 GRUB 在这里读改写。
load_env

if [ -z "$shuios_slot" ]; then
	set shuios_slot="a"
	set shuios_prev="a"
	set shuios_state="ok"
fi

if [ "$shuios_state" = "try" ]; then
	# 刚写入新槽：标记为尝试中，然后启动它。
	set shuios_state="booting"
	save_env shuios_slot shuios_prev shuios_state
elif [ "$shuios_state" = "booting" ]; then
	# 上次尝试没有走到 shuios-boot-ok（新系统起不来）→ 自动回滚。
	echo "shuios: 上一次启动未确认成功，回滚到槽 $shuios_prev"
	set shuios_slot="$shuios_prev"
	set shuios_state="ok"
	save_env shuios_slot shuios_prev shuios_state
fi

if [ "$shuios_slot" = "b" ]; then
	set shuios_root="PARTUUID=5b1e0a00-0000-4000-8000-0000000000b1"
else
	set shuios_root="PARTUUID=5b1e0a00-0000-4000-8000-0000000000a1"
fi

# 菜单文字只用 ASCII：GRUB 的 gfxterm 需要专门的 .pf2 字体才能显示中文，
# 镜像里没有加载中文字体，中文会变成一串乱码（"銆屾硥銆?妲?）。
# 引导菜单只在救援时需要看清，用英文最稳。
menuentry "shuios 0.2 Quan - slot $shuios_slot" {
	linux /Image root=$shuios_root ro rootfstype=squashfs rootwait \
		shuios.slot=$shuios_slot \
		console=tty0 console=ttyS0,115200 loglevel=4
}

menuentry "shuios 0.2 Quan - slot $shuios_slot (verbose)" {
	linux /Image root=$shuios_root ro rootfstype=squashfs rootwait \
		shuios.slot=$shuios_slot \
		console=tty0 console=ttyS0,115200 loglevel=7
}

menuentry "shuios 0.2 Quan - slot $shuios_slot (rescue)" {
	linux /Image root=$shuios_root ro rootfstype=squashfs rootwait \
		shuios.slot=$shuios_slot \
		console=tty0 console=ttyS0,115200 loglevel=7 \
		systemd.unit=rescue.target
}

menuentry "Reboot" {
	reboot
}
