# genimage 配置 — shuios x86_64 磁盘映像（A/B 双根分区）
#
# 布局（GPT，每个分区都有固定 PARTUUID）：
#   1  esp      FAT32      EFI 系统分区：GRUB + 内核 + grubenv（A/B 状态）
#   2  root-a   squashfs   根槽 A
#   3  root-b   raw        根槽 B（初始为零填充，升级时写入新 squashfs）
#   4  data     ext4       持久化数据（工作区 / 模型 / 状态）
#
# 用 PARTUUID 而不是 /dev/sdX 的原因：SATA / USB / NVMe 设备名不同，
# PARTUUID 是稳定的，GRUB 与内核都用它定位。
#
# PARTUUID 必须与 crates/shuios-update/src/slots.rs 里的常量保持一致。

image boot.vfat {
	vfat {
		file EFI {
			image = "efi-part/EFI"
		}

		file Image {
			image = "bzImage"
		}

		label = "SHUI-BOOT"
	}

	size = 64M
}

image shuios.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition esp {
		image = "boot.vfat"
		partition-type-uuid = U
		partition-uuid = 5b1e0a00-0000-4000-8000-0000000000e1
		offset = 1M
		bootable = true
	}

	partition root-a {
		image = "rootfs.squashfs"
		partition-type-uuid = L
		partition-uuid = 5b1e0a00-0000-4000-8000-0000000000a1
	}

	partition root-b {
		image = "root-b.raw"
		partition-type-uuid = L
		partition-uuid = 5b1e0a00-0000-4000-8000-0000000000b1
	}

	partition data {
		image = "data.ext4"
		partition-type-uuid = L
		partition-uuid = 5b1e0a00-0000-4000-8000-0000000000d1
	}
}
