# shuios 运行时目录
d /run/shuios          0750 root root -
d /run/shuios/mcp      0750 root root -
d /workspace           0755 root root -
d /var/lib/shuios      0755 root root -
d /var/lib/shuios/models 0755 root root -
d /var/log/shuios      0755 root root -
d /var/log/shuios/agents 0755 root root -
d /data                0755 root root -
# ESP 挂载点（只读根上必须有这个空目录，fstab 才能挂上去）
d /boot/efi            0755 root root -
