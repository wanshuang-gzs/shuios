# shuios 桌面会话配置（Weston / Wayland）
#
# 注意：**不要**在这里硬指定输出模式。
# 之前写了 [output] name=* mode=1280x800，在 QEMU 的 bochs 显卡上这个模式
# 不被支持，Weston 拿不到可用输出就直接黑屏。让 Weston 自己选首选模式。

[core]
idle-time=0
xwayland=false

[shell]
panel-position=top
clock-format=%H:%M %m-%d
background-color=0x1b2028

[keyboard]
keymap_rules=evdev
keymap_model=pc105
keymap_layout=us,cn
keymap_options=grp:alt_shift_toggle

[autolaunch]
path=/usr/libexec/shuios/shuios-desktop
