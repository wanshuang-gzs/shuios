# shuios 终端主题（foot）
#
# 配色跟任务栏、软件商店同一套（设计令牌见 docs/06-视觉规范.md）：
# 近黑底 BG_WINDOW #0A0C0F + 高对比前景 FG #EEF1F4 + 一点青 ACCENT #35A7CB。
# foot 会读 $XDG_CONFIG_HOME/foot/foot.ini，也读 /etc/xdg/foot/foot.ini。
# foot 读静态 ini、没法 include，这里的色值只能照 shuios-ui.h 抄一遍。

[main]
font=DejaVu Sans Mono:size=11
dpi-aware=no
pad=14x12
selection-target=clipboard

# 客户区装饰（标题栏 + 最小化/最大化/关闭按钮）
#
# 为什么必须显式打开：sway/wlroots 不画服务端标题栏，而 foot 默认会先问
# 合成器要不要服务端装饰；结果就是终端窗口光秃秃一条边框、**没有关闭按钮**，
# 用户根本关不掉窗口。设成 client 之后由 foot 自己画标题栏和按钮。
[csd]
preferred=client
size=28
# 注意：button-color 只接受**一个**颜色（按钮字形色），写成 "背景 前景" 会报
# “not a valid color value”（踩过）。标题栏底色跟随 [colors] background。
button-color=9AA4AE
border-width=1
border-color=292E36
double-click-to-maximize=yes

# 光标：竖条 + 主色，闪烁柔和一点
[cursor]
style=beam
color=0A0C0F 35A7CB
blink=yes

[mouse]
hide-when-typing=no

[colors]
alpha=0.97
background=0A0C0F
foreground=EEF1F4

# 常规色：偏冷、低饱和，避免刺眼
regular0=1b2530
regular1=d96a6a
regular2=7ad17a
regular3=d9c05a
regular4=5aa8d9
regular5=c86dd7
regular6=4fbfbf
regular7=c6ccd4

# 明亮色
bright0=33404f
bright1=ef8080
bright2=94e394
bright3=efd980
bright4=7cc0ef
bright5=db8ae4
bright6=6fd6d6
bright7=f0f4f8

# 选中与搜索高亮
selection-foreground=08161C
selection-background=35A7CB
search-box-no-match=8a2d2d ffdddd
search-box-match=2a323d EEF1F4

[scrollback]
lines=5000
