# shuios 软件仓库位置
#
# 两个仓库可以选：
#   1) 镜像里自带的一份（htop、curl 等小包，离线可用）：
#        repo = /usr/share/shuios/pkgrepo
#   2) 内网 HTTP 仓库（QQ、微信、钉钉、WPS、VS Code 等大包，
#      由 tools/fetch-store-catalog.sh 生成，镜像体积不变）：
#        repo = http://10.0.2.2:8099
#
# 改完后在软件商店点「刷新」，或运行 `shui-pkg update`。
# 注意：根分区是只读的，装好系统后改这个文件不会生效；请把同样的
# `repo = ...` 写到数据分区上的覆盖配置里（优先于本文件）：
#   echo 'repo = http://10.0.2.2:8099' > /var/lib/shuios/pkg/repo.conf
#
# shui-pkg 只支持 http://（镜像里没有 TLS 库），
# 需要 https 时请在前面架一层反向代理。
repo = /usr/share/shuios/pkgrepo
