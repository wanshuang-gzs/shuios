name: 构建 shuios

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 编译 (x86_64 / Ubuntu 24.04 + Qt 6.7)
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ── 用官方 Qt 而非系统 Qt ───────────────────────────
      # Ubuntu 24.04 自带 Qt 6.4.2，而 Qt WaylandCompositor 的
      # QML API 在 6.5 才稳定。这里装官方 Qt 6.7。
      - name: 安装 Qt 6.7
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtwaylandcompositor'
          cache: true

      - name: 安装构建工具与系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config dpkg-dev \
            libgl1-mesa-dev libglvnd-dev libglu1-mesa-dev \
            libxkbcommon-dev \
            libwayland-dev libwayland-bin wayland-protocols \
            libvulkan-dev

      - name: 核对 Qt 环境
        run: |
          echo "=== Qt 安装位置 ==="
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          echo "Qt6_DIR=$Qt6_DIR"
          echo
          echo "=== qmake 版本 ==="
          qmake --version || true
          echo
          echo "=== WaylandCompositor 模块 ==="
          find "$QT_ROOT_DIR" -iname '*WaylandCompositor*' -maxdepth 6 2>/dev/null | head -20 || echo "(未找到)"

      - name: 配置 CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            2>&1 | tee /tmp/cmake-configure.log
          exit ${PIPESTATUS[0]}

      - name: 编译
        run: |
          cmake --build build --parallel 2>&1 | tee /tmp/build-compile.log
          exit ${PIPESTATUS[0]}

      - name: 运行测试
        run: ctest --test-dir build --output-on-failure
        continue-on-error: true

      - name: 打包 .deb
        run: |
          cd build
          cpack -G DEB || echo "打包失败（不影响编译验证）"
          ls -la *.deb 2>/dev/null || true

      - name: 收集产物
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: shuios-deb
          path: build/*.deb
          if-no-files-found: warn

      # ── 失败时收集诊断 ──────────────────────────────────
      - name: 收集诊断日志（失败时）
        if: failure()
        run: |
          mkdir -p /tmp/diag
          cp /tmp/cmake-configure.log /tmp/diag/ 2>/dev/null || true
          cp /tmp/build-compile.log /tmp/diag/ 2>/dev/null || true
          cp build/CMakeFiles/CMakeOutput.log /tmp/diag/ 2>/dev/null || true
          {
            echo "=== Qt 版本 ==="
            qmake --version 2>/dev/null || echo n/a
            echo
            echo "=== QT_ROOT_DIR ==="
            echo "$QT_ROOT_DIR"
            echo
            echo "=== WaylandCompositor 相关文件 ==="
            find "$QT_ROOT_DIR" -iname '*ayland*' 2>/dev/null | head -40 || echo none
            echo
            echo "=== cmake 配置目录 ==="
            ls "$QT_ROOT_DIR/lib/cmake" 2>/dev/null | grep -i wayland || echo none
          } > /tmp/diag/environment.txt
          ls -la /tmp/diag/

      - name: 上传诊断日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /tmp/diag/
          if-no-files-found: warn